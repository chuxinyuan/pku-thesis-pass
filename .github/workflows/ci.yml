name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Install fonts
        run: |
          sudo apt update
          sudo apt install -y fonts-noto-cjk fonts-arphic-ukai
          # Install Microsoft core fonts
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt install -y ttf-mscorefonts-installer
          # Install 'FandolFang' and 'ZhuqueFangsong' font
          sudo mkdir -p /usr/local/share/fonts
          curl -sSL https://mirrors.aliyun.com/CTAN/fonts/fandol/FandolFang-Regular.otf -o /tmp/FandolFang-Regular.otf
          sudo cp /tmp/FandolFang-Regular.otf /usr/local/share/fonts/
          curl -sSL https://mirrors.aliyun.com/CTAN/fonts/lxgw-fonts/LXGWZhuqueFangsong-Regular.ttf -o /tmp/LXGWZhuqueFangsong-Regular.ttf
          sudo cp /tmp/LXGWZhuqueFangsong-Regular.ttf /usr/local/share/fonts/
          sudo fc-cache -fv

      - name: Compile thesis.typ
        run: |
          mkdir -p build
          typst compile template/thesis.typ build/thesis.pdf --root . --input system=linux

      - name: Compile thesis.typ (always-start-odd=true)
        run: |
          typst compile template/thesis.typ build/thesis-odd.pdf --root . --input system=linux --input always-start-odd=true

      - name: Compile thesis.typ (blind mode)
        run: |
          typst compile template/thesis.typ build/thesis-blind.pdf --root . --input system=linux --input blind=true

      - name: Compile thesis.typ (blind + always-start-odd=true)
        run: |
          typst compile template/thesis.typ build/thesis-blind-odd.pdf --root . --input system=linux --input blind=true --input always-start-odd=true

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: thesis-pdfs
          path: |
            build/thesis.pdf
            build/thesis-odd.pdf
            build/thesis-blind.pdf
            build/thesis-blind-odd.pdf
          retention-days: 30

      - name: Prepare GitHub Pages
        run: |
          mkdir -p docs
          cp build/thesis.pdf docs/thesis.pdf
          cp build/thesis-odd.pdf docs/thesis-odd.pdf
          cp build/thesis-blind.pdf docs/thesis-blind.pdf
          cp build/thesis-blind-odd.pdf docs/thesis-blind-odd.pdf
          cat > docs/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>pku-thesis-pass — 北京大学学位论文 Typst 模板</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                line-height: 1.6;
              }
              h1 { color: #8B0012; }
              a { color: #8B0012; }
              .downloads { margin: 2rem 0; }
              .downloads a {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                background: #8B0012;
                color: white;
                text-decoration: none;
                border-radius: 4px;
                margin-right: 1rem;
                margin-bottom: 0.5rem;
              }
              .downloads a:hover { background: #6B0010; }
            </style>
          </head>
          <body>
            <h1>pku-thesis-pass</h1>
            <p>北京大学学位论文 Typst 模板（博士 / 硕士）</p>
            <div class="downloads">
              <a href="thesis.pdf">📄 下载示例论文 — 精简输出 (PDF)</a>
              <a href="thesis-odd.pdf">📄 下载示例论文 — 奇页开篇 (PDF)</a>
              <a href="thesis-blind.pdf">📄 下载盲审版本 — 精简输出 (PDF)</a>
              <a href="thesis-blind-odd.pdf">📄 下载盲审版本 — 奇页开篇 (PDF)</a>
            </div>
            <h2>快速开始</h2>
            <pre><code>typst init @preview/pku-thesis-pass:0.3.0 my-thesis
            cd my-thesis
            typst compile thesis.typ</code></pre>
            <h2>链接</h2>
            <ul>
              <li><a href="https://github.com/chuxinyuan/pku-thesis-pass">GitHub 仓库</a></li>
              <li><a href="https://typst.app/universe/package/pku-thesis-pass">Typst 官网</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Install fonts
        run: |
          sudo apt update
          sudo apt install -y fonts-noto-cjk fonts-arphic-ukai
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt install -y ttf-mscorefonts-installer
          sudo mkdir -p /usr/local/share/fonts
          curl -sSL https://mirrors.aliyun.com/CTAN/fonts/fandol/FandolFang-Regular.otf -o /tmp/FandolFang-Regular.otf
          sudo cp /tmp/FandolFang-Regular.otf /usr/local/share/fonts/
          curl -sSL https://mirrors.aliyun.com/CTAN/fonts/lxgw-fonts/LXGWZhuqueFangsong-Regular.ttf -o /tmp/LXGWZhuqueFangsong-Regular.ttf
          sudo cp /tmp/LXGWZhuqueFangsong-Regular.ttf /usr/local/share/fonts/
          sudo fc-cache -fv

      - name: Run unit tests
        run: |
          typst compile tests/number-test.typ --root .
          typst compile tests/util-test.typ --root .
          typst compile tests/style-test.typ --root .
          typst compile tests/cli-test.typ --root .
          typst compile tests/size-test.typ --root .
          typst compile tests/font-test.typ --root .

      - name: Compile integration tests
        run: |
          typst compile tests/thesis-minimal.typ --root .
          typst compile tests/thesis-linux.typ --root . --input system=linux
          typst compile tests/thesis-full.typ --root .
          typst compile tests/thesis-blind.typ --root . --input blind=true
          typst compile tests/thesis-heading.typ --root .
          typst compile tests/thesis-refs.typ --root .

      - name: Verify blind mode hides author
        run: |
          if strings tests/thesis-blind.pdf | grep -q "张三"; then
            echo "ERROR: author name leaked in blind mode"
            exit 1
          fi
          echo "OK: author name hidden in blind mode"
